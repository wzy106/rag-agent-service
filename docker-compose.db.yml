services:
  mysql:
    image: mysql:8
    container_name: agent-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agent
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: agent-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: