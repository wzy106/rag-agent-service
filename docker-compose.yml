services:
  # MySQL 数据库（Agent 的对话历史展示层）
  mysql:
    image: mysql:8
    container_name: agent-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agent
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - agent-net

  # Agent API 服务
  agent-api:
    build: .
    container_name: agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内 localhost 指容器自己，必须用服务名 mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_DATABASE=agent
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - DATA_DIR=/app/data
      # API Key 鉴权：从宿主机 .env 读 API_KEY，读不到就用默认值
      - API_KEY=${API_KEY:-dev-key-change-me}
    volumes:
      # 模型缓存挂载到宿主机，避免每次重建都重新下载
      - ./hf_cache:/root/.cache/huggingface
      # LangGraph checkpointer 持久化，避免容器重建时记忆丢失
      - ./data:/app/data
      # === 开发期挂载：改代码不用 rebuild ===
      - ./rag_api:/app/rag_api
      - ./mcp_test:/app/mcp_test
      - ./rag_core:/app/rag_core
      - ./docs:/app/docs
      - ./faiss_index:/app/faiss_index
    depends_on:
      - mysql
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  agent-net:
    driver: bridge